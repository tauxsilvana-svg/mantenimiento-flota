<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mantenimiento de Flota</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1c2430;--mut:#667085;--line:#e2e6ec;--pri:#1f5fbf;--ok:#1a8a4a;--warn:#c77700;--crit:#c62828;--prev:#1f5fbf;--corr:#d9622b}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#14233b;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
header .who{font-size:13px;opacity:.9}
nav{display:flex;gap:4px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:6px 12px;position:sticky;top:48px;z-index:4}
nav button{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit;color:var(--mut)}
nav button.on{background:#e7effb;color:var(--pri);font-weight:600}
main{max-width:1150px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:26px}
.kpi span{color:var(--mut);font-size:13px}
button.btn,a.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;display:inline-block}
button.btn.sec{background:#e7ebf1;color:var(--ink)}
button.btn.big{padding:12px 20px;font-size:16px}
button.btn.sm{padding:4px 9px;font-size:13px}
button.btn.danger{background:var(--crit)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:#eef1f5;color:var(--mut)}
.tag.prev{background:#e3edfb;color:var(--prev)}.tag.corr{background:#fbe9df;color:var(--corr)}
.tag.ok{background:#e1f4e8;color:var(--ok)}.tag.warn{background:#fdf0d9;color:var(--warn)}.tag.crit{background:#fbe3e3;color:var(--crit)}
.alert{display:flex;gap:10px;padding:10px 12px;border-left:5px solid var(--warn);background:#fffaf0;border-radius:6px;margin-bottom:8px;align-items:center}
.alert.crit{border-color:var(--crit);background:#fff3f3}
.alert .t{flex:1}
.alert small{color:var(--mut);display:block}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px;border:1px solid #c9d0da;border-radius:7px;font:inherit;background:#fff}
textarea{min-height:70px}
dialog{border:0;border-radius:12px;padding:0;width:min(720px,96vw);max-height:92vh;box-shadow:0 10px 40px #0005}
dialog::backdrop{background:#0006}
.dh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}
.dh h3{margin:0;font-size:17px}.db{padding:14px 16px 18px;overflow:auto;max-height:78vh}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.ck{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.ck .opts{display:flex;gap:4px}
.ck .opts label{display:inline-flex;gap:3px;margin:0;padding:4px 8px;border:1px solid #c9d0da;border-radius:6px;cursor:pointer;color:var(--ink);font-size:13px}
.ck .opts input{width:auto}
.ck input[type=text]{grid-column:1/-1}
.bar{height:14px;border-radius:4px;display:inline-block;vertical-align:middle}
.tl{border-left:3px solid var(--line);margin-left:6px;padding-left:14px}
.tl div{margin-bottom:10px;position:relative}
.tl div:before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.tl small{color:var(--mut)}
.login{max-width:360px;margin:12vh auto}
.mut{color:var(--mut)}
.empty{color:var(--mut);padding:14px;text-align:center}
@media print{header,nav,.noprint{display:none!important}dialog{box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"><div class="dh"><h3 id="dt"></h3><button class="btn sec sm" onclick="closeDlg()">✕</button></div><div class="db" id="dbody"></div></dialog>

<script>
"use strict";
/* ============ Datos ============ */
const KEY = "mantenimiento_flota_v1";
const ITEMS = ["Luces (delanteras/traseras/giro)","Frenos","Neumáticos (estado y presión)","Nivel de aceite motor","Nivel de refrigerante","Líquido de frenos","Batería","Dirección / suspensión","Correas y mangueras","Pérdidas de fluidos","Limpiaparabrisas / espejos","Bocina / alarma de retroceso","Extintor y botiquín","Documentación / VTV / seguro","Carrocería / cabina","Limpieza general"];
const DEF_PLAN=[
  {id:"p5",km:5000,t:"Cambio de aceite y revisión general"},
  {id:"p10",km:10000,t:"Frenos y neumáticos"},
  {id:"p20",km:20000,t:"Batería y filtros"},
  {id:"p50",km:50000,t:"Sistema de refrigeración"},
  {id:"p100",km:100000,t:"Correa de distribución"}];
const DEF_CFG = {kmAviso:500, diasPrevio:30, otDias:7, checkDias:7, novDias:3, plan:DEF_PLAN};

function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function days(a,b){return Math.round((new Date((b||today())+"T00:00:00")-new Date(a+"T00:00:00"))/864e5)}
function addDays(a,n){const d=new Date(a+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtD(d){return d?d.split("-").reverse().join("/"):"—"}
function nowStr(){return new Date().toISOString()}
function fmtT(t){const d=new Date(t);return d.toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"})}

function seed(){
  const t=today();
  return {
    cfg:{...DEF_CFG},
    seq:1,
    users:[
      {user:"jefe",name:"Jefe de Taller",role:"jefe",pin:hash("1234"),obra:""},
      {user:"mecanico",name:"Mecánico 1",role:"mecanico",pin:hash("1234"),obra:""},
      {user:"administrativo",name:"Administrativo",role:"administrativo",pin:hash("1234"),obra:""},
      {user:"obra",name:"Encargado Obra Norte",role:"obra",pin:hash("1234"),obra:"Obra Norte"}
    ],
    vehicles:[
      {id:uid(),code:"M-01",plate:"AB123CD",desc:"Camioneta Toyota Hilux",obra:"Obra Norte",km:48200,kmDia:60,done:{p5:45000,p10:40000,p20:40000,p50:0,p100:0},activo:true},
      {id:uid(),code:"M-02",plate:"AC456EF",desc:"Camión Mercedes 1720",obra:"Obra Norte",km:122900,kmDia:80,done:{p5:120000,p10:120000,p20:100000,p50:100000,p100:100000},activo:true},
      {id:uid(),code:"M-03",plate:"AD789GH",desc:"Retroexcavadora CAT 416",obra:"Obra Sur",km:6100,kmDia:40,done:{p5:0,p10:0,p20:0,p50:0,p100:0},activo:true}
    ],
    ots:[],checklists:[],novedades:[],log:[]
  };
}
let S;
function cloud(){return !!window.FB}
function load(){
  if(cloud()){S={cfg:{...DEF_CFG},seq:1,users:[],vehicles:[],ots:[],checklists:[],novedades:[],log:[]};return}
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S){S=seed();save()}S.cfg={...DEF_CFG,...S.cfg}}
function save(){if(cloud())syncOut();else localStorage.setItem(KEY,JSON.stringify(S))}
function logEv(accion,detalle,vehId,otId){S.log.unshift({id:uid(),t:nowStr(),user:me.user,rol:me.role,accion,detalle,vehId:vehId||null,otId:otId||null});save()}

/* ============ Nube (Firebase) ============ */
const NOMAIL="@flota.app", COLS=["users","vehicles","ots","checklists","novedades","log"];
const keyf=c=>c==="users"?"user":"id";
let shadow={},cfgShadow="",unsubs=[],listening=false,ready=false;
function fail(e){alert("No se pudo guardar en la nube: "+(e&&e.message||e))}
function sortCol(c,a){
  if(c==="vehicles")a.sort((x,y)=>x.code.localeCompare(y.code));
  else if(c==="users")a.sort((x,y)=>x.user.localeCompare(y.user));
  else if(c==="log")a.sort((x,y)=>y.t.localeCompare(x.t));
}
function afterSnap(){
  if(!ready||!me)return;
  const m=S.users.find(u=>u.user===me.user);
  if(!m){FB.AU.signOut(FB.auth);return}
  me=m;
  if(!document.getElementById("dlg").open)render();
}
function startListeners(){
  const {F,db}=FB,ps=[];
  COLS.forEach(c=>{
    let q=F.collection(db,c);if(c==="log")q=F.query(q,F.orderBy("t","desc"),F.limit(300));
    ps.push(new Promise(res=>{unsubs.push(F.onSnapshot(q,snap=>{
      const arr=[];shadow[c]={};
      snap.forEach(d=>{const o=d.data();arr.push(o);shadow[c][String(o[keyf(c)])]=JSON.stringify(o)});
      sortCol(c,arr);S[c]=arr;res();afterSnap();
    },err=>{console.error(c,err);res()}))}));
  });
  ps.push(new Promise(res=>{unsubs.push(F.onSnapshot(F.doc(db,"config","main"),d=>{
    const x=d.exists()?d.data():{};S.cfg={...DEF_CFG,...(x.cfg||{})};S.seq=x.seq||1;cfgShadow=JSON.stringify(S.cfg);res();afterSnap();
  },err=>{console.error(err);res()}))}));
  return Promise.all(ps);
}
function stopListeners(){unsubs.forEach(u=>u());unsubs=[];listening=false;ready=false;shadow={};cfgShadow=""}
function syncOut(){
  const {F,db}=FB;
  COLS.forEach(c=>{
    const sh=shadow[c]||(shadow[c]={}),seen=new Set();
    S[c].forEach(o=>{const k=String(o[keyf(c)]);seen.add(k);const j=JSON.stringify(o);
      if(sh[k]!==j){sh[k]=j;F.setDoc(F.doc(db,c,k),JSON.parse(j)).catch(fail)}});
    if(c!=="log")Object.keys(sh).forEach(k=>{if(!seen.has(k)){delete sh[k];F.deleteDoc(F.doc(db,c,k)).catch(fail)}});
  });
  const cj=JSON.stringify(S.cfg);
  if(cj!==cfgShadow){cfgShadow=cj;F.setDoc(F.doc(db,"config","main"),{cfg:JSON.parse(cj)},{merge:true}).catch(fail)}
}
function nextSeq(){
  const {F,db}=FB,ref=F.doc(db,"config","main");
  return F.runTransaction(db,async tx=>{const r=await tx.get(ref);const n=(r.exists()&&r.data().seq)||1;tx.set(ref,{seq:n+1},{merge:true});return n});
}

/* ============ Sesión ============ */
let me=null, view="";
const NAV={
  jefe:[["panel","Panel"],["alertas","Alertas"],["ots","Órdenes de trabajo"],["novedades","Novedades"],["checklists","Checklists"],["mo","Mano de obra"],["vehiculos","Móviles"],["stats","Estadísticas"],["traza","Trazabilidad"],["admin","Administración"]],
  mecanico:[["panel","Panel"],["alertas","Alertas"],["ots","Órdenes de trabajo"],["mo","Mano de obra"],["vehiculos","Móviles"]],
  administrativo:[["panel","Panel"],["alertas","Alertas"],["ots","Órdenes de trabajo"],["vehiculos","Móviles"],["stats","Estadísticas"]],
  obra:[["checklists","Checklists"],["alertas","Alertas"],["vehiculos","Móviles"]]
};
const ROLE_NAME={jefe:"Jefe de Taller",mecanico:"Mecánico",obra:"Obra",administrativo:"Administrativo"};
function veh(id){return S.vehicles.find(v=>v.id===id)}
function vname(id){const v=veh(id);return v?`${v.code} · ${v.plate}`:"?"}
function myVehicles(){return S.vehicles.filter(v=>v.activo&&(me.role!=="obra"||!me.obra||v.obra===me.obra))}

function boot(){
  load();
  if(cloud()){
    FB.AU.onAuthStateChanged(FB.auth,async fu=>{
      if(!fu){stopListeners();me=null;loginView();return}
      document.getElementById("app").innerHTML='<div class="login card"><p class="mut">Cargando datos…</p></div>';
      if(!listening){listening=true;await startListeners()}
      const un=fu.email.split("@")[0];
      let boot1=false;
      if(!S.users.length){S.users.push({user:un,name:un.charAt(0).toUpperCase()+un.slice(1),role:"jefe",obra:""});boot1=true}
      me=S.users.find(u=>u.user===un);
      if(!me){await FB.AU.signOut(FB.auth);loginView("Tu usuario no tiene acceso. Pedile al jefe de taller que te dé de alta.");return}
      if(boot1)save();
      ready=true;view=NAV[me.role][0][0];logEv("Ingreso","Inicio de sesión");render();
    });
    return;
  }
  const u=sessionStorage.getItem("sess");
  me=u?S.users.find(x=>x.user===u):null;
  if(me){view=NAV[me.role][0][0];render()}else loginView();
}
function loginView(msg){
  const c=cloud();
  document.getElementById("app").innerHTML=`<div class="login card"><h2>🔧 Mantenimiento de Flota</h2>
  <p class="mut">Ingresá con tu usuario y ${c?"clave":"PIN"}.</p>
  <form id="lf"><label>Usuario</label><input name="u" autocomplete="username" autocapitalize="none" required>
  <label>${c?"Clave":"PIN"}</label><input name="p" type="password" autocomplete="current-password" required>
  <p id="le" style="color:var(--crit);min-height:20px">${esc(msg||"")}</p>
  <button class="btn big" style="width:100%">Ingresar</button></form>
  <p style="text-align:center;margin:12px 0 0"><a href="guia.html" target="_blank">Guía rápida de uso</a></p>
  ${c?'<p class="mut" style="font-size:12px;margin-top:14px">Datos compartidos en la nube. Si no tenés usuario, pedíselo al jefe de taller.</p>':'<p class="mut" style="font-size:12px;margin-top:14px">Modo local (sin nube). Usuarios iniciales: <b>jefe</b>, <b>mecanico</b>, <b>administrativo</b>, <b>obra</b> — PIN <b>1234</b>. Cambialos desde Administración.</p>'}</div>`;
  document.getElementById("lf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
    const un=f.get("u").trim().toLowerCase();
    if(c){
      try{await FB.AU.signInWithEmailAndPassword(FB.auth,un+NOMAIL,f.get("p"))}
      catch(err){document.getElementById("le").textContent=["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email"].includes(err.code)?"Usuario o clave incorrectos":"Error: "+err.code}
      return;
    }
    const u=S.users.find(x=>x.user===un&&x.pin===hash(f.get("p")));
    if(!u){document.getElementById("le").textContent="Usuario o PIN incorrecto";return}
    me=u;sessionStorage.setItem("sess",u.user);view=NAV[me.role][0][0];logEv("Ingreso","Inicio de sesión");render()};
}
function logout(){if(cloud()){FB.AU.signOut(FB.auth);return}sessionStorage.removeItem("sess");me=null;loginView()}

/* ============ Alertas ============ */
function planOf(){return ((S.cfg.plan&&S.cfg.plan.length)?S.cfg.plan:DEF_PLAN).slice().sort((a,b)=>a.km-b.km)}
function kmDia(v){
  const pts=[];S.checklists.filter(k=>k.vehId===v.id).forEach(k=>pts.push([k.fecha,k.km]));
  S.ots.filter(o=>o.vehId===v.id).forEach(o=>{pts.push([o.fechaAlta,o.kmIngreso]);if(o.fechaCierre&&o.kmCierre)pts.push([o.fechaCierre,o.kmCierre])});
  const lim=addDays(today(),-90),p=pts.filter(x=>x[0]>=lim&&x[1]).sort((a,b)=>a[0].localeCompare(b[0]));
  if(p.length>=2){const d=days(p[0][0],p[p.length-1][0]),dk=p[p.length-1][1]-p[0][1];if(d>=7&&dk>0)return dk/d}
  return v.kmDia||60;
}
function planInfo(v){
  const r=kmDia(v);
  return planOf().map(it=>{
    const last=(v.done&&v.done[it.id])||0,next=last+it.km,rest=next-v.km,dias=rest>0?Math.round(rest/r):0;
    let st="ok";if(rest<=0)st="crit";else if(rest<=S.cfg.kmAviso||dias<=S.cfg.diasPrevio)st="warn";
    return {it,next,rest,dias,st};
  });
}
const nk=n=>Number(n).toLocaleString("es-AR");
function alerts(){
  const A=[],c=S.cfg,t=today();
  for(const v of S.vehicles.filter(v=>v.activo)){
    const pi=planInfo(v).filter(x=>x.st!=="ok");
    if(pi.length){
      const open=S.ots.filter(o=>o.vehId===v.id&&o.tipo==="Preventivo"&&o.estado!=="Cerrada");
      const pend=pi.filter(x=>!open.some(o=>(o.items||[]).includes(x.it.id)));
      A.push({nivel:pi.some(x=>x.st==="crit")?"crit":"warn",cat:"service",veh:v.id,
        txt:`${pi.some(x=>x.st==="crit")?"MANTENIMIENTO PREVENTIVO VENCIDO":"Vence mantenimiento preventivo"} — ${v.code} ${v.plate}`,
        sub:pi.map(x=>`${nk(x.it.km)} km (${x.it.t}): ${x.rest<=0?"vencido hace "+nk(-x.rest)+" km":"vence en ~"+x.dias+" días, faltan "+nk(x.rest)+" km (a los "+nk(x.next)+" km)"}`).join(" · ")+(pend.length?" · sin OT preventiva":" · ya tiene OT preventiva abierta"),
        act:pend.length?{l:"Generar OT preventiva",f:`newOT('${v.id}','Preventivo',null,'${pend.map(x=>x.it.id).join(",")}')`,r:"jefe"}:null});
    }
    const lc=S.checklists.filter(k=>k.vehId===v.id).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
    const d=lc?days(lc.fecha):null;
    if(!lc||d>c.checkDias)A.push({nivel:"warn",cat:"checklist",veh:v.id,txt:`Sin checklist — ${v.code} ${v.plate}`,sub:lc?`Último checklist hace ${d} días (${fmtD(lc.fecha)})`:"Nunca se cargó un checklist",act:{l:"Cargar checklist",f:`newCheck('${v.id}')`,r:"obra"}});
  }
  for(const o of S.ots.filter(o=>o.estado!=="Cerrada")){
    const a=days(o.fechaAlta);
    if(a>c.otDias)A.push({nivel:"crit",cat:"ot",veh:o.vehId,ot:o.id,txt:`OT sin cerrar — ${o.num} (${o.tipo})`,sub:`${vname(o.vehId)} · abierta hace ${a} días · estado ${o.estado}`,act:{l:"Ver OT",f:`openOT('${o.id}')`,r:"*"}});
    else if(o.estado==="Abierta"&&a>=2)A.push({nivel:"warn",cat:"ot",veh:o.vehId,ot:o.id,txt:`OT sin iniciar — ${o.num}`,sub:`${vname(o.vehId)} · ${a} días en estado Abierta`,act:{l:"Ver OT",f:`openOT('${o.id}')`,r:"*"}});
  }
  for(const n of S.novedades.filter(n=>n.estado==="abierta"&&!n.otId)){
    const a=days(n.fecha);
    A.push({nivel:a>c.novDias?"crit":"warn",cat:"reparacion",veh:n.vehId,txt:`Falta reparación — ${vname(n.vehId)}`,sub:`${n.item}${n.obs?": "+n.obs:""} · detectado hace ${a} días, sin OT correctiva`,act:{l:"Generar OT correctiva",f:`newOT('${n.vehId}','Correctivo','${n.id}')`,r:"jefe"}});
  }
  const o={crit:0,warn:1};
  A.sort((x,y)=>o[x.nivel]-o[y.nivel]);
  return A;
}
function alertsForMe(){
  const A=alerts();
  const vs=new Set(myVehicles().map(v=>v.id));
  return A.filter(a=>vs.has(a.veh)&&(me.role==="jefe"||me.role==="administrativo"||(me.role==="mecanico"&&["ot","service","reparacion"].includes(a.cat))||(me.role==="obra"&&["service","checklist","reparacion"].includes(a.cat))));
}
function alertHTML(a){
  const can=a.act&&(a.act.r==="*"||a.act.r===me.role||me.role==="jefe");
  return `<div class="alert ${a.nivel}"><div class="t"><b>${esc(a.txt)}</b><small>${esc(a.sub)}</small></div>${can?`<button class="btn sm" onclick="${a.act.f}">${a.act.l}</button>`:""}</div>`;
}

/* ============ Render ============ */
function render(){
  const nav=NAV[me.role];
  const nA=alertsForMe().length;
  document.getElementById("app").innerHTML=`
  <header><h1>🔧 Mantenimiento de Flota</h1><span class="who">${esc(me.name)} · ${ROLE_NAME[me.role]}${me.obra?" · "+esc(me.obra):""}</span><a class="btn sec sm" href="guia.html" target="_blank">Guía</a><button class="btn sec sm" onclick="logout()">Salir</button></header>
  <nav>${nav.map(([k,l])=>`<button class="${k===view?"on":""}" onclick="go('${k}')">${l}${k==="alertas"&&nA?` <span class="tag crit">${nA}</span>`:""}</button>`).join("")}</nav>
  <main id="main"></main>`;
  const f=V[view]||V.panel;
  const ven=["jefe","administrativo","obra"].includes(me.role)&&view!=="alertas"?alertsForMe().filter(a=>a.cat==="service"):[];
  const banner=ven.length?`<div class="alert ${ven.some(a=>a.nivel==="crit")?"crit":""}" style="cursor:pointer" onclick="go('alertas')"><div class="t"><b>⚠ ${ven.length} móvil${ven.length>1?"es":""} con mantenimiento preventivo vencido o por vencer (aviso ${S.cfg.diasPrevio} días antes)</b><small>${esc(ven.slice(0,3).map(a=>a.txt.split(" — ")[1]).join(" · "))}${ven.length>3?" …":""} — tocá para ver el detalle</small></div></div>`:"";
  document.getElementById("main").innerHTML=banner+f();
  if(afterRender[view])afterRender[view]();
}
function go(v){view=v;render();window.scrollTo(0,0)}
const afterRender={};

const V={};
V.panel=()=>{
  const A=alertsForMe(),crit=A.filter(a=>a.nivel==="crit").length;
  const open=S.ots.filter(o=>o.estado!=="Cerrada");
  const mine=me.role==="mecanico"?open.filter(o=>!o.asignado||o.asignado===me.user):open;
  const nov=S.novedades.filter(n=>n.estado==="abierta").length;
  return `<div class="row" style="margin-bottom:14px">${me.role==="jefe"?`<button class="btn big" onclick="newOT()">＋ Cargar orden de trabajo</button>`:""}${me.role==="mecanico"?`<button class="btn big" onclick="newMO()">＋ Cargar planilla de mano de obra</button>`:""}</div>
  <div class="kpis">
    <div class="kpi"><b style="color:var(--crit)">${crit}</b><span>Alertas críticas</span></div>
    <div class="kpi"><b style="color:var(--warn)">${A.length-crit}</b><span>Advertencias</span></div>
    <div class="kpi"><b>${mine.length}</b><span>OT abiertas</span></div>
    <div class="kpi"><b>${nov}</b><span>Novedades sin cerrar</span></div>
    <div class="kpi"><b>${S.vehicles.filter(v=>v.activo).length}</b><span>Móviles activos</span></div>
  </div>
  <div class="card"><h2>Alertas principales</h2>${A.slice(0,6).map(alertHTML).join("")||'<div class="empty">Sin alertas ✔</div>'}${A.length>6?`<button class="btn sec sm" onclick="go('alertas')">Ver las ${A.length} alertas</button>`:""}</div>
  <div class="card"><h2>Órdenes abiertas</h2>${otTable(mine.slice(0,8))}</div>`;
};
V.alertas=()=>{
  const A=alertsForMe();
  return `<div class="card"><h2>Alertas (${A.length})</h2><p class="mut">Vencimientos del plan preventivo (aviso ${S.cfg.diasPrevio} días antes, según el km diario de cada móvil), OT sin cerrar (más de ${S.cfg.otDias} días), reparaciones detectadas sin OT y móviles sin checklist (más de ${S.cfg.checkDias} días).</p>${A.map(alertHTML).join("")||'<div class="empty">Sin alertas ✔</div>'}</div>`;
};

/* ----- OT ----- */
function otTable(list){
  if(!list.length)return '<div class="empty">No hay órdenes</div>';
  return `<div class="tw"><table><tr><th>N°</th><th>Móvil</th><th>Tipo</th><th>Descripción</th><th>Alta</th><th>Estado</th><th></th></tr>${list.map(o=>{
    const a=o.estado!=="Cerrada"?days(o.fechaAlta):null;
    return `<tr><td><b>${o.num}</b></td><td>${esc(vname(o.vehId))}</td><td><span class="tag ${o.tipo==="Preventivo"?"prev":"corr"}">${o.tipo}</span></td><td>${esc(o.desc).slice(0,70)}</td><td>${fmtD(o.fechaAlta)}${a!==null&&a>S.cfg.otDias?` <span class="tag crit">${a} d</span>`:""}</td><td><span class="tag ${o.estado==="Cerrada"?"ok":o.estado==="En proceso"?"warn":""}">${o.estado}</span></td><td><button class="btn sm sec" onclick="openOT('${o.id}')">Abrir</button></td></tr>`}).join("")}</table></div>`;
}
let fOT={tipo:"",estado:"",veh:""};
V.ots=()=>{
  let l=S.ots.slice().sort((a,b)=>b.num.localeCompare(a.num));
  if(fOT.tipo)l=l.filter(o=>o.tipo===fOT.tipo);
  if(fOT.estado==="abiertas")l=l.filter(o=>o.estado!=="Cerrada");else if(fOT.estado)l=l.filter(o=>o.estado===fOT.estado);
  if(fOT.veh)l=l.filter(o=>o.vehId===fOT.veh);
  return `<div class="card"><div class="row"><h2 class="grow">Órdenes de trabajo</h2>${me.role==="jefe"?`<button class="btn big" onclick="newOT()">＋ Cargar orden de trabajo</button>`:""}</div>
  <div class="row"><select onchange="fOT.tipo=this.value;render()" style="width:auto"><option value="">Todos los tipos</option><option ${fOT.tipo==="Preventivo"?"selected":""}>Preventivo</option><option ${fOT.tipo==="Correctivo"?"selected":""}>Correctivo</option></select>
  <select onchange="fOT.estado=this.value;render()" style="width:auto"><option value="">Todos los estados</option><option value="abiertas" ${fOT.estado==="abiertas"?"selected":""}>Abiertas (sin cerrar)</option><option ${fOT.estado==="Cerrada"?"selected":""}>Cerrada</option></select>
  <select onchange="fOT.veh=this.value;render()" style="width:auto"><option value="">Todos los móviles</option>${S.vehicles.map(v=>`<option value="${v.id}" ${fOT.veh===v.id?"selected":""}>${esc(v.code+" · "+v.plate)}</option>`).join("")}</select>
  <button class="btn sec sm" onclick="csvOTs()">Exportar CSV</button></div>${otTable(l)}</div>`;
};
function vehOptions(sel){return S.vehicles.filter(v=>v.activo).map(v=>`<option value="${v.id}" ${sel===v.id?"selected":""}>${esc(v.code+" · "+v.plate+" — "+v.desc)}</option>`).join("")}
function newOT(vehId,tipo,novId,itemIds){
  if(me.role!=="jefe")return;
  vehId=vehId||(S.vehicles[0]&&S.vehicles[0].id);tipo=tipo||"Correctivo";
  const nv=novId?S.novedades.find(n=>n.id===novId):null;
  const mecs=S.users.filter(u=>u.role==="mecanico");
  const body=`<form id="f"><div class="grid2"><div><label>Móvil</label><select name="veh" id="ov" onchange="refNov();refPlan(true)">${vehOptions(vehId)}</select></div>
  <div><label>Tipo de mantenimiento</label><select name="tipo" id="otipo" onchange="refPlan()"><option ${tipo==="Preventivo"?"selected":""}>Preventivo</option><option ${tipo==="Correctivo"?"selected":""}>Correctivo</option></select></div>
  <div><label>Prioridad</label><select name="prio"><option>Normal</option><option>Alta</option><option>Urgente</option></select></div>
  <div><label>Mecánico asignado</label><select name="asig"><option value="">Sin asignar</option>${mecs.map(m=>`<option value="${m.user}">${esc(m.name)}</option>`).join("")}</select></div>
  <div><label>Fecha</label><input type="date" name="fecha" value="${today()}" required></div>
  <div><label>Km al ingreso</label><input type="number" name="km" id="okm" min="0" required></div></div>
  <div id="planbox"></div>
  <label>Descripción del trabajo</label><textarea name="desc" id="odesc" required data-auto="${nv?0:1}" oninput="this.dataset.auto=0">${nv?esc(nv.item+(nv.obs?": "+nv.obs:"")):""}</textarea>
  <div id="novbox"></div>
  <div class="row" style="margin-top:14px"><button class="btn">Crear orden</button></div></form>`;
  openDlg("Nueva orden de trabajo",body);
  window.refNov=()=>{const id=document.getElementById("ov").value;document.getElementById("okm").value=veh(id).km;
    const ns=S.novedades.filter(n=>n.vehId===id&&n.estado==="abierta"&&!n.otId);
    document.getElementById("novbox").innerHTML=ns.length?`<label>Vincular novedades de checklist detectadas</label>${ns.map(n=>`<label style="color:var(--ink)"><input type="checkbox" name="nov" value="${n.id}" style="width:auto" ${n.id===novId?"checked":""}> ${esc(n.item)} ${n.obs?"— "+esc(n.obs):""} <span class="mut">(${fmtD(n.fecha)})</span></label>`).join("")}`:""};
  let pre=itemIds?itemIds.split(","):null;
  window.refPlan=first=>{
    const pb=document.getElementById("planbox"),t=document.getElementById("otipo").value;
    if(t!=="Preventivo"){pb.innerHTML="";return}
    const v=veh(document.getElementById("ov").value),pi=planInfo(v);
    const sel=pre&&first!==true?pre:pi.filter(x=>x.st!=="ok").map(x=>x.it.id);
    pb.innerHTML='<label>Trabajos del plan preventivo a realizar</label>'+pi.map(x=>'<label style="color:var(--ink)"><input type="checkbox" name="pi" value="'+x.it.id+'" style="width:auto" onchange="refDesc()" '+(sel.includes(x.it.id)?"checked":"")+'> <b>'+nk(x.it.km)+' km</b> — '+esc(x.it.t)+' <span class="tag '+x.st+'">'+(x.rest<=0?"vencido":"faltan "+nk(x.rest)+" km")+'</span></label>').join("");
    refDesc();
  };
  window.refDesc=()=>{const d=document.getElementById("odesc");if(d.dataset.auto!=="1")return;
    const ids=[...document.querySelectorAll('#planbox input:checked')].map(i=>i.value);
    d.value=ids.length?"Mantenimiento preventivo: "+planOf().filter(p=>ids.includes(p.id)).map(p=>nk(p.km)+" km ("+p.t+")").join("; "):""};
  refNov();refPlan();
  document.getElementById("f").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
    if(f.get("tipo")==="Preventivo"&&!f.getAll("pi").length){alert("Elegí al menos un trabajo del plan preventivo");return}
    const n=cloud()?await nextSeq():S.seq++;
    const o={id:uid(),num:"OT-"+String(n).padStart(4,"0"),vehId:f.get("veh"),tipo:f.get("tipo"),prio:f.get("prio"),desc:f.get("desc").trim(),estado:"Abierta",fechaAlta:f.get("fecha"),fechaCierre:null,kmIngreso:+f.get("km"),kmCierre:null,asignado:f.get("asig"),creadoPor:me.user,mo:[],rep:[],hist:[],novs:f.getAll("nov"),items:f.get("tipo")==="Preventivo"?f.getAll("pi"):[],trabajo:""};
    o.hist.push({t:nowStr(),user:me.user,txt:"OT creada ("+o.tipo+")"});
    S.ots.push(o);o.novs.forEach(id=>{const n=S.novedades.find(x=>x.id===id);if(n)n.otId=o.id});
    const v=veh(o.vehId);if(o.kmIngreso>v.km)v.km=o.kmIngreso;
    logEv("OT creada",`${o.num} ${o.tipo}: ${o.desc}`,o.vehId,o.id);closeDlg();render();openOT(o.id)};
}
function openOT(id){
  const o=S.ots.find(x=>x.id===id),v=veh(o.vehId),closed=o.estado==="Cerrada";
  const hs=o.mo.reduce((s,m)=>s+m.horas,0),cost=o.rep.reduce((s,r)=>s+r.cant*r.costo,0);
  const asig=S.users.find(u=>u.user===o.asignado);
  const canMO=!closed&&(me.role==="mecanico"||me.role==="jefe");
  const body=`<div class="row"><span class="tag ${o.tipo==="Preventivo"?"prev":"corr"}">${o.tipo}</span><span class="tag ${closed?"ok":"warn"}">${o.estado}</span><span class="tag">Prioridad ${o.prio}</span></div>
  <p><b>${esc(vname(o.vehId))}</b> — ${esc(v.desc)}<br>Alta ${fmtD(o.fechaAlta)} · Km ingreso ${o.kmIngreso}${closed?` · Cierre ${fmtD(o.fechaCierre)} · Km cierre ${o.kmCierre}`:""}<br>Asignado: ${asig?esc(asig.name):"sin asignar"}</p>
  <p>${esc(o.desc)}</p>${(o.items||[]).length?`<p class="mut">Plan: ${planOf().filter(p=>o.items.includes(p.id)).map(p=>nk(p.km)+" km — "+esc(p.t)).join(" · ")}</p>`:""}${o.novs.length?`<p class="mut">Novedades vinculadas: ${o.novs.map(i=>{const n=S.novedades.find(x=>x.id===i);return n?esc(n.item):""}).join(", ")}</p>`:""}
  ${closed&&o.trabajo?`<p><b>Trabajo realizado:</b> ${esc(o.trabajo)}</p>`:""}
  <h4>Mano de obra (${hs} hs)</h4>${o.mo.length?`<div class="tw"><table><tr><th>Fecha</th><th>Mecánico</th><th>Horas</th><th>Tarea</th></tr>${o.mo.map(m=>`<tr><td>${fmtD(m.fecha)}</td><td>${esc(m.nombre)}</td><td>${m.horas}</td><td>${esc(m.tarea)}</td></tr>`).join("")}</table></div>`:'<div class="mut">Sin planillas cargadas</div>'}
  ${canMO?`<button class="btn sm" onclick="newMO('${o.id}')">＋ Cargar mano de obra</button>`:""}
  <h4>Repuestos / insumos ($ ${cost.toLocaleString("es-AR")})</h4>${o.rep.length?`<div class="tw"><table><tr><th>Detalle</th><th>Cant.</th><th>Costo unit.</th></tr>${o.rep.map(r=>`<tr><td>${esc(r.desc)}</td><td>${r.cant}</td><td>${r.costo}</td></tr>`).join("")}</table></div>`:'<div class="mut">Sin repuestos</div>'}
  ${canMO?`<button class="btn sm sec" onclick="newRep('${o.id}')">＋ Agregar repuesto</button>`:""}
  <h4>Historial de la orden</h4><div class="tl">${o.hist.slice().reverse().map(h=>`<div><b>${esc(h.txt)}</b><br><small>${fmtT(h.t)} · ${esc(h.user)}</small></div>`).join("")}</div>
  <div class="row noprint" style="margin-top:14px">${me.role==="jefe"&&!closed?`${o.estado==="Abierta"?`<button class="btn sec" onclick="setEstado('${o.id}','En proceso')">Pasar a En proceso</button>`:""}<button class="btn" onclick="closeOTForm('${o.id}')">Cerrar orden</button>`:""}<button class="btn sec" onclick="window.print()">Imprimir</button></div>`;
  openDlg(`${o.num}`,body);
}
function setEstado(id,e){const o=S.ots.find(x=>x.id===id);o.estado=e;o.hist.push({t:nowStr(),user:me.user,txt:"Estado: "+e});logEv("Cambio de estado",`${o.num} → ${e}`,o.vehId,o.id);render();openOT(id)}
function closeOTForm(id){
  const o=S.ots.find(x=>x.id===id);
  if(!o.mo.length){alert("Para cerrar la OT debe haber al menos una planilla de mano de obra cargada (trazabilidad).");return}
  openDlg("Cerrar "+o.num,`<form id="f"><div class="grid2"><div><label>Fecha de cierre</label><input type="date" name="fecha" value="${today()}" required></div><div><label>Km al cierre</label><input type="number" name="km" value="${Math.max(veh(o.vehId).km,o.kmIngreso)}" min="${o.kmIngreso}" required></div></div>
  <label>Trabajo realizado</label><textarea name="trab" required></textarea>${o.tipo==="Preventivo"?'<p class="mut">Al cerrar, se registran como realizados los trabajos del plan elegidos y se recalcula el próximo vencimiento de cada uno.</p>':""}
  <button class="btn" style="margin-top:12px">Cerrar orden</button></form>`);
  document.getElementById("f").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
    o.estado="Cerrada";o.fechaCierre=f.get("fecha");o.kmCierre=+f.get("km");o.trabajo=f.get("trab").trim();
    o.hist.push({t:nowStr(),user:me.user,txt:"OT cerrada"});
    const v=veh(o.vehId);if(o.kmCierre>v.km)v.km=o.kmCierre;
    if(o.tipo==="Preventivo"){v.done=v.done||{};(o.items||[]).forEach(i=>{v.done[i]=o.kmCierre})}
    S.novedades.forEach(n=>{if(n.otId===o.id){n.estado="cerrada";n.fechaCierre=o.fechaCierre}});
    logEv("OT cerrada",`${o.num} ${o.tipo}`,o.vehId,o.id);closeDlg();render()};
}
function newMO(otId){
  const open=S.ots.filter(o=>o.estado!=="Cerrada"&&(me.role==="jefe"||!o.asignado||o.asignado===me.user));
  if(!open.length){alert("No hay órdenes abiertas para cargar mano de obra.");return}
  const mecs=S.users.filter(u=>u.role==="mecanico");
  openDlg("Planilla de mano de obra",`<form id="f"><label>Orden de trabajo</label><select name="ot">${open.map(o=>`<option value="${o.id}" ${o.id===otId?"selected":""}>${o.num} · ${esc(vname(o.vehId))} · ${o.tipo}</option>`).join("")}</select>
  <div class="grid2"><div><label>Fecha</label><input type="date" name="fecha" value="${today()}" required></div><div><label>Horas trabajadas</label><input type="number" name="h" step="0.25" min="0.25" required></div></div>
  ${me.role==="jefe"?`<label>Mecánico</label><select name="mec">${mecs.map(m=>`<option value="${m.user}">${esc(m.name)}</option>`).join("")}</select>`:""}
  <label>Tarea realizada</label><textarea name="t" required></textarea><button class="btn" style="margin-top:12px">Guardar planilla</button></form>`);
  document.getElementById("f").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const o=S.ots.find(x=>x.id===f.get("ot"));
    const mu=me.role==="jefe"?S.users.find(u=>u.user===f.get("mec")):me;
    o.mo.push({fecha:f.get("fecha"),user:mu.user,nombre:mu.name,horas:+f.get("h"),tarea:f.get("t").trim(),cargo:me.user});
    if(o.estado==="Abierta")o.estado="En proceso";
    o.hist.push({t:nowStr(),user:me.user,txt:`Mano de obra: ${f.get("h")} hs (${mu.name})`});
    logEv("Mano de obra",`${o.num}: ${f.get("h")} hs — ${f.get("t")}`,o.vehId,o.id);closeDlg();render()};
}
function newRep(id){
  openDlg("Agregar repuesto",`<form id="f"><label>Detalle</label><input name="d" required><div class="grid2"><div><label>Cantidad</label><input type="number" name="c" value="1" min="1" required></div><div><label>Costo unitario ($)</label><input type="number" name="p" value="0" min="0" step="0.01" required></div></div><button class="btn" style="margin-top:12px">Agregar</button></form>`);
  document.getElementById("f").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const o=S.ots.find(x=>x.id===id);
    o.rep.push({desc:f.get("d").trim(),cant:+f.get("c"),costo:+f.get("p")});o.hist.push({t:nowStr(),user:me.user,txt:"Repuesto: "+f.get("d")});
    logEv("Repuesto",`${o.num}: ${f.get("d")} x${f.get("c")}`,o.vehId,o.id);closeDlg();render();openOT(id)};
}
V.mo=()=>{
  const rows=[];S.ots.forEach(o=>o.mo.forEach(m=>rows.push({o,m})));
  let l=me.role==="mecanico"?rows.filter(r=>r.m.user===me.user):rows;
  l.sort((a,b)=>b.m.fecha.localeCompare(a.m.fecha));
  const tot=l.reduce((s,r)=>s+r.m.horas,0);
  return `<div class="card"><div class="row"><h2 class="grow">Planillas de mano de obra (${tot} hs)</h2><button class="btn big" onclick="newMO()">＋ Cargar planilla</button></div>
  ${l.length?`<div class="tw"><table><tr><th>Fecha</th><th>OT</th><th>Móvil</th><th>Mecánico</th><th>Horas</th><th>Tarea</th></tr>${l.map(r=>`<tr><td>${fmtD(r.m.fecha)}</td><td><a href="#" onclick="openOT('${r.o.id}');return false">${r.o.num}</a></td><td>${esc(vname(r.o.vehId))}</td><td>${esc(r.m.nombre)}</td><td>${r.m.horas}</td><td>${esc(r.m.tarea)}</td></tr>`).join("")}</table></div>`:'<div class="empty">Sin planillas</div>'}</div>`;
};

/* ----- Checklists / novedades ----- */
V.checklists=()=>{
  const vs=new Set(myVehicles().map(v=>v.id));
  const l=S.checklists.filter(k=>vs.has(k.vehId)).sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.t.localeCompare(a.t));
  return `<div class="card"><div class="row"><h2 class="grow">Checklists de móviles</h2><button class="btn big" onclick="newCheck()">＋ Cargar checklist</button></div>
  ${l.length?`<div class="tw"><table><tr><th>Fecha</th><th>Móvil</th><th>Obra</th><th>Cargó</th><th>Km</th><th>Resultado</th><th></th></tr>${l.map(k=>{const bad=k.items.filter(i=>i.r==="mal").length;return `<tr><td>${fmtD(k.fecha)}</td><td>${esc(vname(k.vehId))}</td><td>${esc(k.obra||"—")}</td><td>${esc(k.nombre)}</td><td>${k.km}</td><td><span class="tag ${bad?"crit":"ok"}">${bad?bad+" con falla":"Todo OK"}</span></td><td><button class="btn sm sec" onclick="viewCheck('${k.id}')">Ver</button></td></tr>`}).join("")}</table></div>`:'<div class="empty">Aún no hay checklists</div>'}</div>`;
};
function newCheck(vehId){
  const vs=myVehicles();if(!vs.length){alert("No hay móviles disponibles");return}
  vehId=vehId||vs[0].id;
  openDlg("Checklist de móvil",`<form id="f"><div class="grid2"><div><label>Móvil</label><select name="veh" id="cv" onchange="document.getElementById('ckm').value=veh(this.value).km">${vs.map(v=>`<option value="${v.id}" ${v.id===vehId?"selected":""}>${esc(v.code+" · "+v.plate+" — "+v.desc)}</option>`).join("")}</select></div>
  <div><label>Fecha</label><input type="date" name="fecha" value="${today()}" required></div>
  <div><label>Kilometraje actual</label><input type="number" id="ckm" name="km" value="${veh(vehId).km}" min="0" required></div></div>
  <label>Controles (marcar Bien / Mal / N/A)</label>
  ${ITEMS.map((it,i)=>`<div class="ck"><span>${it}</span><div class="opts"><label><input type="radio" name="r${i}" value="ok" checked> Bien</label><label><input type="radio" name="r${i}" value="mal"> Mal</label><label><input type="radio" name="r${i}" value="na"> N/A</label></div><input type="text" name="o${i}" placeholder="Observación (obligatoria si está Mal)"></div>`).join("")}
  <label>Observaciones generales</label><textarea name="gen"></textarea><button class="btn big" style="margin-top:12px;width:100%">Guardar checklist</button></form>`);
  document.getElementById("f").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
    const items=ITEMS.map((it,i)=>({n:it,r:f.get("r"+i),o:f.get("o"+i).trim()}));
    const falta=items.find(i=>i.r==="mal"&&!i.o);if(falta){alert("Falta la observación en: "+falta.n);return}
    const v=veh(f.get("veh"));
    const k={id:uid(),t:nowStr(),vehId:v.id,fecha:f.get("fecha"),km:+f.get("km"),obra:me.obra||v.obra,user:me.user,nombre:me.name,items,gen:f.get("gen").trim()};

/* ----- Estadísticas ----- */
function statRows(){
  return S.vehicles.map(v=>{
    const os=S.ots.filter(o=>o.vehId===v.id);
    const p=os.filter(o=>o.tipo==="Preventivo"),c=os.filter(o=>o.tipo==="Correctivo");
    return {v,p:p.length,pc:p.filter(o=>o.estado==="Cerrada").length,c:c.length,cc:c.filter(o=>o.estado==="Cerrada").length,
      hs:os.reduce((s,o)=>s+o.mo.reduce((a,m)=>a+m.horas,0),0),cost:os.reduce((s,o)=>s+o.rep.reduce((a,r)=>a+r.cant*r.costo,0),0),
      nov:S.novedades.filter(n=>n.vehId===v.id&&n.estado==="abierta").length};
  });
}
V.stats=()=>{
  const R=statRows(),max=Math.max(1,...R.map(r=>r.p+r.c));
  const P=R.reduce((s,r)=>s+r.p,0),C=R.reduce((s,r)=>s+r.c,0);
  return `<div class="kpis"><div class="kpi"><b style="color:var(--prev)">${P}</b><span>Preventivos totales</span></div><div class="kpi"><b style="color:var(--corr)">${C}</b><span>Correctivos totales</span></div><div class="kpi"><b>${P+C?Math.round(P*100/(P+C)):0}%</b><span>Proporción preventivo</span></div><div class="kpi"><b>${R.reduce((s,r)=>s+r.hs,0)}</b><span>Horas de mano de obra</span></div></div>
  <div class="card"><h2>Mantenimientos por móvil</h2><p class="mut"><span class="bar" style="background:var(--prev);width:14px"></span> Preventivos &nbsp; <span class="bar" style="background:var(--corr);width:14px"></span> Correctivos</p>
  <div class="tw"><table><tr><th>Móvil</th><th>Gráfico</th><th>Preventivos (cerrados)</th><th>Correctivos (cerrados)</th><th>Horas MO</th><th>Repuestos $</th><th>Novedades abiertas</th></tr>${R.map(r=>`<tr><td><b>${esc(r.v.code)}</b><br><small class="mut">${esc(r.v.plate)}</small></td><td style="min-width:160px"><span class="bar" style="background:var(--prev);width:${r.p/max*100}%"></span><span class="bar" style="background:var(--corr);width:${r.c/max*100}%"></span></td><td>${r.p} (${r.pc})</td><td>${r.c} (${r.cc})</td><td>${r.hs}</td><td>${r.cost.toLocaleString("es-AR")}</td><td>${r.nov}</td></tr>`).join("")}</table></div>
  <button class="btn sec sm" style="margin-top:10px" onclick="csvStats()">Exportar CSV</button></div>
  <div class="card"><h2>Órdenes cerradas por mecánico</h2><p class="mut">Una OT cerrada cuenta para el mecánico si estaba asignada a él o si cargó mano de obra en ella.</p>
  <div class="tw"><table><tr><th>Mecánico</th><th>OT cerradas</th><th>Preventivas</th><th>Correctivas</th><th>OT abiertas</th><th>Horas cargadas</th><th>Horas por OT cerrada</th></tr>${mecRows().map(r=>`<tr><td><b>${esc(r.u.name)}</b><br><small class="mut">${esc(r.u.user)}</small></td><td><b>${r.cer}</b></td><td>${r.cp}</td><td>${r.cc}</td><td>${r.abi}</td><td>${r.hs}</td><td>${r.cer?(r.hsCer/r.cer).toFixed(1):"—"}</td></tr>`).join("")||'<tr><td colspan="7" class="empty">No hay mecánicos cargados</td></tr>'}</table></div>
  <button class="btn sec sm" style="margin-top:10px" onclick="csvMec()">Exportar CSV</button></div>`;
};
function mecRows(){
  return S.users.filter(u=>u.role==="mecanico").map(u=>{
    const mine=S.ots.filter(o=>o.asignado===u.user||o.mo.some(m=>m.user===u.user));
    const cer=mine.filter(o=>o.estado==="Cerrada");
    const hrs=o=>o.mo.filter(m=>m.user===u.user).reduce((s,m)=>s+m.horas,0);
    return {u,cer:cer.length,cp:cer.filter(o=>o.tipo==="Preventivo").length,cc:cer.filter(o=>o.tipo==="Correctivo").length,abi:mine.length-cer.length,hs:mine.reduce((s,o)=>s+hrs(o),0),hsCer:cer.reduce((s,o)=>s+hrs(o),0)};
  }).sort((a,b)=>b.cer-a.cer);
}

function trazaVeh(id){
  const v=veh(id),ev=[];
  S.ots.filter(o=>o.vehId===id).forEach(o=>{ev.push({d:o.fechaAlta,txt:`${o.num} ${o.tipo} abierta — ${o.desc}`,k:o.tipo});if(o.fechaCierre)ev.push({d:o.fechaCierre,txt:`${o.num} ${o.tipo} CERRADA a ${o.kmCierre} km — ${o.trabajo}`,k:o.tipo})});
  S.checklists.filter(k=>k.vehId===id).forEach(k=>{const b=k.items.filter(i=>i.r==="mal").length;ev.push({d:k.fecha,txt:`Checklist (${k.nombre}) a ${k.km} km — ${b?b+" fallas":"todo OK"}`,k:"Checklist"})});
  ev.sort((a,b)=>b.d.localeCompare(a.d));
  openDlg("Historia de "+v.code+" · "+v.plate,`<p>${esc(v.desc)} · ${v.km} km</p><div class="tl">${ev.map(e=>`<div><b>${fmtD(e.d)}</b> <span class="tag ${e.k==="Preventivo"?"prev":e.k==="Correctivo"?"corr":""}">${e.k}</span><br>${esc(e.txt)}</div>`).join("")||'<div class="mut">Sin historial</div>'}</div>`);
}

function editUser(u){
  const x=u?S.users.find(y=>y.user===u):{user:"",name:"",role:"mecanico",obra:""};
  openDlg(u?"Editar usuario":"Nuevo usuario",`<form id="f"><div class="grid2"><div><label>Usuario</label><input name="user" value="${esc(x.user)}" ${u?"readonly":""} required></div><div><label>Nombre</label><input name="name" value="${esc(x.name)}" required></div>
  <div><label>Rol</label><select name="role"><option value="jefe" ${x.role==="jefe"?"selected":""}>Jefe de Taller</option><option value="mecanico" ${x.role==="mecanico"?"selected":""}>Mecánico</option><option value="administrativo" ${x.role==="administrativo"?"selected":""}>Administrativo</option><option value="obra" ${x.role==="obra"?"selected":""}>Obra</option></select></div>
  <div><label>Obra (solo rol Obra)</label><input name="obra" value="${esc(x.obra||"")}"></div><div><label>PIN ${u?"(vacío = no cambiar)":""}</label><input name="pin" type="password" ${u?"":"required"}></div></div>
  <div class="row" style="margin-top:12px"><button class="btn">Guardar</button>${u&&u!==me.user?`<button type="button" class="btn danger" onclick="delUser('${u}')">Eliminar</button>`:""}</div></form>`);
  document.getElementById("f").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
    const un=f.get("user").trim().toLowerCase(),pin=f.get("pin");
    if(!u&&S.users.some(y=>y.user===un)){alert("Ese usuario ya existe");return}
    if(u===me.user&&f.get("role")!=="jefe"){alert("No podés quitarte el rol de jefe");return}
    if(cloud()){
      const {A,AU,cfg}=FB;
      if(!u){
        if(!/^[a-z0-9._-]+$/.test(un)){alert("El usuario solo puede tener letras minúsculas, números, punto, guion y guion bajo");return}
        if(pin.length<6){alert("La clave debe tener al menos 6 caracteres");return}
        try{let sec;try{sec=A.getApp("sec")}catch(_){sec=A.initializeApp(cfg,"sec")}
          const a2=AU.getAuth(sec);await AU.createUserWithEmailAndPassword(a2,un+NOMAIL,pin);await AU.signOut(a2)}
        catch(err){alert(err.code==="auth/email-already-in-use"?"Ese usuario ya existe en el sistema de acceso (puede haber sido eliminado antes). Usá otro nombre.":"No se pudo crear: "+err.message);return}
      }else if(pin){
        if(u!==me.user){alert("La clave de otro usuario solo puede cambiarla él mismo (o el administrador desde la consola de Firebase).");return}
        if(pin.length<6){alert("La clave debe tener al menos 6 caracteres");return}
        try{await AU.updatePassword(FB.auth.currentUser,pin)}catch(err){alert("No se pudo cambiar la clave. Cerrá sesión, volvé a entrar y reintentá.");return}
      }
    }
    const n=u?x:{user:un};Object.assign(n,{name:f.get("name").trim(),role:f.get("role"),obra:f.get("obra").trim()});
    if(pin&&!cloud())n.pin=hash(pin);if(!u)S.users.push(n);
    logEv(u?"Usuario editado":"Usuario creado",un);closeDlg();render()};
}
function slug(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,".").replace(/^\.|\.$/g,"")}
function altaMec(){
  const c=cloud();
  openDlg("Alta rápida de mecánicos",`<form id="f"><label>Nombres (uno por línea, por ejemplo 4 mecánicos)</label><textarea name="n" rows="5" placeholder="Juan Pérez&#10;Carlos Gómez&#10;Luis Díaz&#10;Pedro Ruiz" required></textarea>
  <label>${c?"Clave inicial (mín. 6 caracteres)":"PIN inicial"} para todos</label><input name="p" type="text" required>
  <p class="mut">El usuario se arma con el nombre (ej. juan.perez). Cada mecánico puede cambiar su clave después, desde Editar.</p>
  <button class="btn" style="margin-top:12px">Crear mecánicos</button></form>`);
  document.getElementById("f").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),pin=f.get("p").trim();
    if(c&&pin.length<6){alert("La clave debe tener al menos 6 caracteres");return}
    const names=f.get("n").split("\n").map(s=>s.trim()).filter(Boolean);const ok=[],bad=[];
    for(const name of names){
      const un=slug(name);
      if(!un||S.users.some(y=>y.user===un)){bad.push(name+" (usuario ya existe)");continue}
      if(c){const {A,AU,cfg}=FB;try{let sec;try{sec=A.getApp("sec")}catch(_){sec=A.initializeApp(cfg,"sec")}
        const a2=AU.getAuth(sec);await AU.createUserWithEmailAndPassword(a2,un+NOMAIL,pin);await AU.signOut(a2)}
        catch(err){bad.push(name+" ("+(err.code==="auth/email-already-in-use"?"ya existe en el sistema de acceso":err.message)+")");continue}}
      const n={user:un,name,role:"mecanico",obra:""};if(!c)n.pin=hash(pin);S.users.push(n);ok.push(un);
    }
    if(ok.length)logEv("Usuarios creados","Mecánicos: "+ok.join(", "));
    closeDlg();render();
    alert((ok.length?"Creados: "+ok.join(", ")+".\n":"")+(bad.length?"No creados: "+bad.join("; "):""));};
}
function delUser(u){if(confirm("¿Eliminar el usuario "+u+"?"+(cloud()?" Pierde el acceso a la aplicación.":""))){S.users=S.users.filter(x=>x.user!==u);logEv("Usuario eliminado",u);closeDlg();render()}}

/* ============ Utilidades ============ */
function openDlg(t,h){document.getElementById("dt").textContent=t;document.getElementById("dbody").innerHTML=h;const d=document.getElementById("dlg");if(!d.open)d.showModal()}
function closeDlg(){const d=document.getElementById("dlg");if(d.open)d.close()}
function download(name,txt,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function csv(rows){return "﻿"+rows.map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(";")).join("\r\n")}
function csvOTs(){download("ordenes_trabajo.csv",csv([["N°","Móvil","Tipo","Prioridad","Estado","Alta","Cierre","Km ingreso","Km cierre","Horas MO","Repuestos $","Descripción","Trabajo realizado"],...S.ots.map(o=>[o.num,vname(o.vehId),o.tipo,o.prio,o.estado,o.fechaAlta,o.fechaCierre,o.kmIngreso,o.kmCierre,o.mo.reduce((s,m)=>s+m.horas,0),o.rep.reduce((s,r)=>s+r.cant*r.costo,0),o.desc,o.trabajo])]),"text/csv")}
function csvStats(){download("estadisticas_moviles.csv",csv([["Móvil","Patente","Preventivos","Prev. cerrados","Correctivos","Corr. cerrados","Horas MO","Repuestos $","Novedades abiertas"],...statRows().map(r=>[r.v.code,r.v.plate,r.p,r.pc,r.c,r.cc,r.hs,r.cost,r.nov])]),"text/csv")}
function csvMec(){download("ordenes_por_mecanico.csv",csv([["Mecánico","Usuario","OT cerradas","Preventivas","Correctivas","OT abiertas","Horas"],...mecRows().map(r=>[r.u.name,r.u.user,r.cer,r.cp,r.cc,r.abi,r.hs])]),"text/csv")}
function exportJSON(){download("mantenimiento_backup_"+today()+".json",JSON.stringify(S,null,1),"application/json")}
function importJSON(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.vehicles||!d.users)throw 0;if(!confirm("Esto reemplaza todos los datos actuales. ¿Continuar?"))return;S=d;save();alert("Datos importados. Volvé a ingresar.");logout()}catch(e){alert("Archivo inválido")}};r.readAsText(f)}
function resetAll(){if(confirm("Se borrarán TODOS los datos de este navegador. ¿Seguro?")&&confirm("Última confirmación: borrar todo.")){localStorage.removeItem(KEY);sessionStorage.clear();location.reload()}}
document.getElementById("dlg").addEventListener("click",e=>{if(e.target.id==="dlg")closeDlg()});
window.startApp=boot;

<script type="module">
let FB=null;
let cfg=null;
try{cfg=(await import("./firebase-config.js")).default}catch(e){}
try{
  if(cfg&&cfg.apiKey){
    const V="10.12.2",B="https://www.gstatic.com/firebasejs/"+V+"/";
    const [A,AU,F]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
    const app=A.initializeApp(cfg);
    FB={A,AU,F,cfg,auth:AU.getAuth(app),db:F.getFirestore(app)};
  }
}catch(e){console.error(e);alert("No se pudo conectar con la nube; se usa el modo local. "+e.message)}
window.FB=FB;
window.startApp();
</script>
